BASE_TASK_CONFIG_PATH: "configs/audionav/av_nav/replica/audiogoal_whc.yaml"
SENSORS: ["DEPTH_SENSOR"]
NUM_UPDATES: 40000
LOG_INTERVAL: 10
CHECKPOINT_INTERVAL: 50
VIDEO_OPTION: []
VISUALIZATION_OPTION: []
MOVING: True
ENV_NAME: "AudioNavRLEnv"
TRAINER_NAME: "WhcAVNavTrainer"
NUM_PROCESSES: 1
feature_type: 0
TORCH_GPU_ID: 0
batch_size_pre: 512
num_epoch: 50000
contrastive_m: 1
PRE_TRAIN_DATA_PATH: "/home/user/Documents/pre_train_data"
pre_model: /data/AudioVisual/pre_train
pre_jpg: /data/AudioVisual/pre_train
USE_SYNC_VECENV: True
RL:
  PPO:
    # ppo params
    clip_param: 0.1
    ppo_epoch: 4
    num_mini_batch: 1
    value_loss_coef: 0.5
    entropy_coef: 0.20
    lr: 2.5e-4
    eps: 1e-5
    max_grad_norm: 0.5
    # decide the length of history that ppo encodes
    num_steps: 150
    hidden_size: 512
    use_gae: True
    gamma: 0.99
    tau: 0.95
    use_linear_clip_decay: True
    use_linear_lr_decay: True
    # window size for calculating the past rewards
    reward_window_size: 50