BASE_TASK_CONFIG_PATH: "configs/audionav/av_wan/replica/audiogoal_multiple.yaml"
NUM_PROCESSES: 1
SENSORS: ["DEPTH_SENSOR"]
TEST_EPISODE_COUNT: 1000
VIDEO_OPTION: ["disk"]
#VIDEO_OPTION: []
VIDEO_DIR: '/data/AudioVisual/sound-spaces/ss_baselines/av_wan/Demo'
VISUALIZATION_OPTION: []
ENCODE_DEPTH: True 
USE_SYNC_VECENV: False
TRAINER_NAME: "XcxAVWanTrainer"
ENV_NAME: "WhcMapNavEnv"
TEST_EPISODE_COUNT: 5000
EVAL:
  SPLIT: "train_multiple"
  USE_CKPT_CONFIG: True
RL:
  PPO:
    # ppo params
    clip_param: 0.1
    ppo_epoch: 4
    num_mini_batch: 1
    value_loss_coef: 0.5
    entropy_coef: 0.02
    lr: 2.5e-4
    eps: 1e-5
    max_grad_norm: 0.5
    # decide the length of history that ppo encodes
    num_steps: 150 # todo: change back to 150 step
    hidden_size: 512
    use_gae: True
    gamma: 0.99
    tau: 0.95
    use_linear_clip_decay: True
    use_linear_lr_decay: True
    use_exponential_lr_decay: False
    exp_decay_lambda: 5.0
    # window size for calculating the past rewards
    reward_window_size: 50

    # add abilation choice
    is_visual_encode: False # if encode visual image to feature to the pipeline
    is_classify: True 
    is_visual_classify: False 
    is_regression: True
    is_cross_attention: False
    is_map_attention: False
    is_against: True
    is_help_classify: False

    # if reshape after map_att (to regard it as a image)
    is_mapattention_vec_reshape_to_img: False
    is_reshape_groundtruth_loss: False
    
