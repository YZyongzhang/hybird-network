ENVIRONMENT:
  MAX_EPISODE_STEPS: 200

SIMULATOR:
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 0
  SENSORS: ["DEPTH_SENSOR"]
  RGB_SENSOR:
    WIDTH: 128
    HEIGHT: 128
  DEPTH_SENSOR:
    WIDTH: 128
    HEIGHT: 128
  TYPE: "SoundSpacesSim"
  ACTION_SPACE_CONFIG: "v0"
  SCENE_DATASET: "mp3d"
  GRID_SIZE: 1.0
  AUDIO:
    RIR_SAMPLING_RATE: 16000

TASK:
  TYPE: AudioNav
  SUCCESS_DISTANCE: 1.0
  SENSORS: ["SPECTROGRAM_SENSOR", "AngleSensor"]
  GOAL_SENSOR_UUID: spectrogram
  MEASUREMENTS:
    - "DISTANCE_TO_GOAL"
    - "NORMALIZED_DISTANCE_TO_GOAL"
    - "SUCCESS"
    - "SPL"
    - "SOFT_SPL"
    - "NUM_ACTION"
    - "SUCCESS_WEIGHTED_BY_NUM_ACTION"
    - "TOP_DOWN_MAP"
  SUCCESS:
    SUCCESS_DISTANCE: 1.0
  TOP_DOWN_MAP:
    MAP_RESOLUTION: 500
    DRAW_SOURCE_AND_TARGET: True
    DRAW_BORDER: True
    DRAW_SHORTEST_PATH: True

COLLECT:
  OPEN: False
  GRID_SIZE: 1.0
  TYPE: "collided"
  # Used by TYPE: "collided"
  MAX_STEPS: 200
  RECOVERY_MAX_TRIES: 4
  POLICY_MIX_HYBRID: 0.75
  POLICY_MIX_ORACLE: 0.15
  POLICY_MIX_RANDOM: 0.10
  DATA_STRUCT:
    {"obs": [], "reward": [], "done": [], "action_id": [], "info": [], "map": [], "path_point": [], "sound_id": [], "greedy_action": [], "total_sound_point": []}
  DATA_DIR: "dataset-data3/dataset/pickle/offline(muti_collided)"
  IMG_DIR: ""
  IMG_TYPE: ""
  COLLECT_CKPT: "artifacts/experiments/heard_unheard/heard/hybird_ckpt/model_epoch_100.pth"

PT:
  OPEN: True
  TYPE: "offlinetransformer_v16" # offlinelstm_v15 | offlinetransformer_v16
  RAW_DATA_PATH: "dataset-data3/dataset/pickle/offline(1.5_muti)/level3"
  TO_PATH: "media/pt/offline_LSTM_muti_embedding_reward_scaled"
  CKPT: "artifacts/experiments/heard_unheard/heard/hybird_ckpt/model_epoch_100.pth"
  SHARD_SIZE: 10000
  SEQ_LEN: 5
  EMBED_BATCH_SIZE: 64
  # Reward shaping for PT production
  REWARD_SCALE_ENABLE: True
  REWARD_GLOBAL_SCALE: 1.0
  REWARD_COLLISION_PENALTY: -0.5
  REWARD_ESCAPE_COLLISION_BONUS: 0.4
  REWARD_BAD_STOP_PENALTY: -8.0
  STOP_ACTION_ID: 0
  STOP_SUCCESS_DISTANCE: 0
  COLLISION_REWARD_THRESHOLD: -4.0
  REWARD_MIN_CLIP: -100.0
  REWARD_MAX_CLIP: 100.0

TRAIN:
  OPEN: False
  TYPE: "DORL"  # HybirdNetwork | HybirdNetworkAudio | OfflineRL | OnlineRL | DORL
  SAVE_LOADER: False
  EXPERIMENT_CKPT_DIR: "PR/heard/ckpt"

  # Used only when TYPE is HybirdNetwork/HybirdNetworkAudio
  EPOCH: 100
  BATCH_SIZE: 128
  train_shard_pattern: ["/hdd-data3/hybird/hybird(heard_train_multiple)/foundation_model_shard_0.pt"]
  val_shard_pattern: ["/hdd-data3/hybird/hybird(val_multiple_heard)/foundation_model_shard_0.pt"]

  OFFLINE:
    TYPE: "OfflineRL"
    model: "v1_6"  # v1 | v1_3 | v1_4 | v1_5 | v1_6 | v2 | v4 | v5
    buffer: False
    SAVE_LOADER: False

    LOAD_PATH: False
    MODEL_PATH: "media/offline_hybird/7/sac_2level_model_300.pth" # LOAD_PATH 为true时生效
    EXPERIMENT_CKPT_DIR: "media/TRAIN"

    train_shard_pattern:
      - "media/pt/offline_LSTM_muti_embedding_reward_scaled"
      - "media/pt/offline_LSTM_muti_embedding_collided_reward_scaled"
    ONLINE_CKPT: "artifacts/experiments/heard_unheard/heard/hybird_ckpt/model_epoch_100.pth"

    RANDOM_SHARD_RELOAD: True
    RANDOM_SHARDS_PER_EPOCH: 28
    RELOAD_SHARDS_EVERY_EPOCHS: 10
    RANDOM_SHARD_SEED: 0
    PREFETCH_FACTOR: 2
    NUM_WORKERS: 0
    PERSISTENT_WORKERS: True

    replay_epoch: 1000
    log_interval: 1
    online_test_epoch: 10
    batch_size: 512
    num_epochs: 300

    state_dim: 256
    action_dim: 4
    hidden_dim: 128
    lr: 0.0002
    target_entropy: 0.8
    tau: 0.005
    beta: 0.5
    gamma: 0.99
    lstm_hidden_dim: 256
    lstm_num_layers: 1
    lstm_seq_len: 5
    transformer_dim: 256
    transformer_heads: 4
    transformer_layers: 2
    transformer_ffn_dim: 512
    max_seq_len: 16

  ONLINE:
    TYPE: "OnlineRL"
    experiment: "v1_freeze"  # custom | v1_freeze | v2_scratch
    model: "v2"  # used when experiment=custom. v1: foundation init, v2: random init
    EXPERIMENT_CKPT_DIR: "media/ONLINE"
    LOAD_PATH: False
    MODEL_PATH: ""

    FOUNDATION_CKPT: "artifacts/experiments/heard_unheard/heard/hybird_ckpt/model_epoch_100.pth"  # required for v1_freeze/custom-v1, ignored in v2_scratch
    freeze_backbone: False  # forced True in v1_freeze, forced False in v2_scratch
    use_pose_encoder: True
    pose_dim: 7
    pose_hidden_dim: 64

    MAX_STEPS: 200
    num_epochs: 300000
    save_every: 10
    log_interval: 20

    action_dim: 4
    hidden_dim: 256
    lr: 0.0003
    critic_lr: 0.0003
    alpha_lr: 0.0001
    gamma: 0.99
    tau: 0.005
    target_entropy: 1.08  # 0.8 * 1.386
    batch_size: 128
    buffer_size: 5000
    warmup_steps: 500
    updates_per_step: 1
    max_grad_norm: 1.0
    log_alpha_min: -10.0
    log_alpha_max: 2.0
    q_target_min: -100.0
    q_target_max: 100.0
    REWARD_SHAPING_ENABLE: True
    REWARD_GLOBAL_SCALE: 1.0
    REWARD_COLLISION_PENALTY: -0.5
    REWARD_ESCAPE_COLLISION_BONUS: 1.0
    REWARD_BAD_STOP_PENALTY: -8.0
    STOP_ACTION_ID: 0
    STOP_SUCCESS_DISTANCE: 0.0
    REWARD_MIN_CLIP:
    REWARD_MAX_CLIP:

  DORL:
    DORL_PT_ROOT: "media/pt/offline_muti_embedding_DORL"
    VAL_DORL_PT_ROOT: "data_DORL_pt_validation"
    action_dim: 4
    hidden_dim: 256
    actor_lr: 0.0003
    critic_lr: 0.0003
    alpha_lr: 0.0001
    target_entropy: 0.2
    gamma: 0.99
    tau: 0.005
    batch_size: 256
    buffer_size: 2000
    warmup_steps: 2000
    updates_per_step: 1
    max_grad_norm: 1.0
    q_target_min: -100.0
    q_target_max: 100.0
    log_alpha_min: -10.0
    log_alpha_max: 2.0
    train_epochs: 30
    episodes_per_epoch: 0 # episodes_per_epoch = env.episodes
    max_steps: 200
    save_every: 5
    ckpt_dir: "media/DORL/ckpt"
    tb_log_dir: "media/DORL/log"
    stochastic_policy: True
    greedy_prob_start: 0.15
    greedy_prob_end: 0.02
    greedy_decay_epochs: 25
    log_interval: 100
    mismatch_reward: -1.0

EVAL:
  OPEN: False
  TYPE: "OnlineRL"  # OfflineRL_v1_3 | OfflineRL_v1_5 | OnlineRL
  HYBRID_CKPT: "compare/ckpt/hybirdnetwork_RGBD_two_frame/model_epoch_100.pth"
  SAC_CKPT: "final/telephone/ckpt/8/sac_2level_model_300.pth"
  EPISODES: 0
  MAX_STEPS: 200
  SEED: 0
  STOCHASTIC_SAC: False
  # Used when TYPE is OnlineRL
  ONLINE_MODEL: "v2"  # v1 | v2
  ONLINE_MODEL_PATH: "media/ONLINE/20260304_112625/onlinerl_epoch_2310.pth"
  ONLINE_GREEDY: False
  ONLINE_LOG_EVERY: 1
  ONLINE_DATASET_SPLIT: "val_multiple"
  # Optional for v1_5 separate-weight eval
  TEMPORAL_CKPT: ""
  ACTOR_CKPT: ""
  CRITIC1_CKPT: ""
  CRITIC2_CKPT: ""
  # DORL eval (train/eval_dorl.py)
  DORL_MODEL_PATH: "media/DORL/ckpt/dorl_sac_epoch_30.pth"
  DORL_HYBRID_CKPT: "artifacts/experiments/heard_unheard/heard/hybird_ckpt/model_epoch_100.pth"
  DORL_DATASET_SPLIT: "val_multiple"
  DORL_GREEDY: True
  DORL_LOG_EVERY: 1

DATASET:
  TYPE: "AudioNav"
  SPLIT: "train_multiple"
  CONTENT_SCENES: ["*"]
  VERSION: "v1"
  SCENES_DIR: "data/scene_datasets/mp3d"
  DATA_PATH: "data/datasets/audionav/mp3d/{version}/{split}/{split}.json.gz"
