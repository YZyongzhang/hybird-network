ENVIRONMENT:
  MAX_EPISODE_STEPS: 500
SIMULATOR:
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 0
  RGB_SENSOR:
    WIDTH: 128
    HEIGHT: 128
  DEPTH_SENSOR:
    WIDTH: 128
    HEIGHT: 128

  TYPE: "SoundSpacesSim"
  ACTION_SPACE_CONFIG: "v0"
  SCENE_DATASET: "mp3d"
  GRID_SIZE: 1.0
  AUDIO:
    RIR_SAMPLING_RATE: 16000

TASK:
  TYPE: AudioNav
  SUCCESS_DISTANCE: 1.0

  SENSORS: ['SPECTROGRAM_SENSOR' , 'AngleSensor']
  GOAL_SENSOR_UUID: spectrogram

  MEASUREMENTS: ['DISTANCE_TO_GOAL', 'NORMALIZED_DISTANCE_TO_GOAL', 'SUCCESS', 'SPL', 'SOFT_SPL', 'NUM_ACTION', 'SUCCESS_WEIGHTED_BY_NUM_ACTION' , 'TOP_DOWN_MAP']
  SUCCESS:
    SUCCESS_DISTANCE: 1.0
  TOP_DOWN_MAP:
    MAP_RESOLUTION: 500
    DRAW_SOURCE_AND_TARGET: True
    DRAW_BORDER: True
    DRAW_SHORTEST_PATH: True
    
COLLECT:
  OPEN: False
  TYPE: "offlineRL"
  DATA_STRUCT: {"obs":[],"reward":[],"done":[],"action_id":[],"info":[],"map":[],"path_point":[],"sound_id":[]}
  DATA_DIR: "dataset/pickle/v2/greedy(offlineRL_train)" #"pickle/greedy"
  IMG_DIR: ""
  IMG_TYPE: ""
  COLLECT_CKPT: "HybirdNetworkCkpt/hybirdnetwork/ckpt/hybirdnetwork/model_epoch_best.pth"

TRAIN:
  OPEN: True
  SAVE_LOADER: False
  TYPE: "OfflineRL"
  EXPERIMENT_LOSS_DIR: "experiment/loss/hybirdnetwork"
  EXPERIMENT_CKPT_DIR: "experiment/ckpt/hybirdnetwork"
  TRAIN_DATASET: "dataset/lmdb/v2/greedy(angle_train)"
  VAL_DATASET: "dataset/lmdb/v2/greedy(angle_val)"
  EPOCH: 1000
  BATCH_SIZE: 128
  train_shard_pattern: "dataset/pt/v2/greedy(angle_train)/foundation_model_shard_*.pt"
  val_shard_pattern: "dataset/pt/v2/greedy(angle_val)/foundation_model_shard_*.pt"
  OFFLINE: 
    TYPE: "OfflineRL"
    SAVE_LOADER: False
    EXPERIMENT_LOSS_DIR: "experiment/loss/offline/9"
    EXPERIMENT_CKPT_DIR: "experiment/ckpt/offline"
    train_shard_pattern: "dataset/pt/v2/greedy(offline)/offline_rl_shard_0.pt"
    ONLINE_CKPT: "HybirdNetworkCkpt/hybirdnetwork/ckpt/hybirdnetwork/model_epoch_best.pth"
    state_dim: 256
    action_dim: 4
    hidden_dim: 128
    lr: 0.0004
    target_entropy: -4
    tau: 0.005
    gamma: 0.99
    batch_size: 64
    num_epochs : 10000

LMDB:
  OPEN: False
  TYPE: "offline"
  RAW_DATA_PATH: "dataset/pickle/v2/greedy(offlineRL_train)"
  TO_PATH: "dataset/pt/v2/greedy(offline_train)"
  CKPT: "HybirdNetworkCkpt/hybirdnetwork/ckpt/hybirdnetwork/model_epoch_best.pth"


DATASET:
  TYPE: "AudioNav"
  SPLIT: "val_telephone"
  CONTENT_SCENES: ["*"]
  VERSION: 'v1'
  SCENES_DIR: "data/scene_datasets/mp3d"
  DATA_PATH: "data/datasets/audionav/mp3d/{version}/{split}/{split}.json.gz"
