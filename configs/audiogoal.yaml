ENVIRONMENT:
  MAX_EPISODE_STEPS: 200

SIMULATOR:
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 0
  SENSORS: ["DEPTH_SENSOR"]
  RGB_SENSOR:
    WIDTH: 128
    HEIGHT: 128
  DEPTH_SENSOR:
    WIDTH: 128
    HEIGHT: 128
  TYPE: "SoundSpacesSim"
  ACTION_SPACE_CONFIG: "v0"
  SCENE_DATASET: "mp3d"
  GRID_SIZE: 1.0
  AUDIO:
    RIR_SAMPLING_RATE: 16000

TASK:
  TYPE: AudioNav
  SUCCESS_DISTANCE: 1.0
  SENSORS: ["SPECTROGRAM_SENSOR", "AngleSensor"]
  GOAL_SENSOR_UUID: spectrogram
  MEASUREMENTS:
    - "DISTANCE_TO_GOAL"
    - "NORMALIZED_DISTANCE_TO_GOAL"
    - "SUCCESS"
    - "SPL"
    - "SOFT_SPL"
    - "NUM_ACTION"
    - "SUCCESS_WEIGHTED_BY_NUM_ACTION"
    - "TOP_DOWN_MAP"
  SUCCESS:
    SUCCESS_DISTANCE: 1.0
  TOP_DOWN_MAP:
    MAP_RESOLUTION: 500
    DRAW_SOURCE_AND_TARGET: True
    DRAW_BORDER: True
    DRAW_SHORTEST_PATH: True

COLLECT:
  OPEN: true
  GRID_SIZE: 1.0
  TYPE: "collided"
  # Used by TYPE: "collided"
  MAX_STEPS: 200
  RECOVERY_MAX_TRIES: 4
  POLICY_MIX_HYBRID: 0.75
  POLICY_MIX_ORACLE: 0.15
  POLICY_MIX_RANDOM: 0.10
  DATA_STRUCT:
    {"obs": [], "reward": [], "done": [], "action_id": [], "info": [], "map": [], "path_point": [], "sound_id": [], "greedy_action": [], "total_sound_point": []}
  DATA_DIR: "dataset-data3/dataset/pickle/offline(muti_collided)"
  IMG_DIR: ""
  IMG_TYPE: ""
  COLLECT_CKPT: "artifacts/experiments/heard_unheard/heard/hybird_ckpt/model_epoch_100.pth"

PT:
  OPEN: False
  TYPE: "offlinelstm_v15"
  RAW_DATA_PATH: "dataset-data3/dataset/pickle/offline(muti_collided)"
  TO_PATH: "media/pt/offline_LSTM_muti_embedding_collided"
  CKPT: "artifacts/experiments/heard_unheard/heard/hybird_ckpt/model_epoch_100.pth"
  SHARD_SIZE: 10000
  SEQ_LEN: 5
  EMBED_BATCH_SIZE: 64

TRAIN:
  OPEN: False
  TYPE: "OfflineRL"  # HybirdNetwork | HybirdNetworkAudio | OfflineRL
  SAVE_LOADER: False
  EXPERIMENT_CKPT_DIR: "PR/heard/ckpt"

  # Used only when TYPE is HybirdNetwork/HybirdNetworkAudio
  EPOCH: 100
  BATCH_SIZE: 128
  train_shard_pattern: ["/hdd-data3/hybird/hybird(heard_train_multiple)/foundation_model_shard_0.pt"]
  val_shard_pattern: ["/hdd-data3/hybird/hybird(val_multiple_heard)/foundation_model_shard_0.pt"]

  OFFLINE:
    TYPE: "OfflineRL"
    model: "v1_5"  # v1 | v1_3 | v1_4 | v1_5 | v2 | v4 | v5
    buffer: False
    SAVE_LOADER: False

    LOAD_PATH: False
    MODEL_PATH: "media/offline_hybird/7/sac_2level_model_300.pth" # LOAD_PATH 为true时生效
    EXPERIMENT_CKPT_DIR: "media/TRAIN"

    train_shard_pattern:
      - "media/pt/offline_LSTM_muti_embedding"
      - "media/pt/offline_LSTM_muti_embedding_collided"
    ONLINE_CKPT: "artifacts/experiments/heard_unheard/heard/hybird_ckpt/model_epoch_100.pth"

    RANDOM_SHARD_RELOAD: True
    RANDOM_SHARDS_PER_EPOCH: 12
    RELOAD_SHARDS_EVERY_EPOCHS: 10
    RANDOM_SHARD_SEED: 0
    PREFETCH_FACTOR: 2
    NUM_WORKERS: 0
    PERSISTENT_WORKERS: True

    replay_epoch: 1000
    log_interval: 1
    online_test_epoch: 10
    batch_size: 512
    num_epochs: 300

    state_dim: 256
    action_dim: 4
    hidden_dim: 128
    lr: 0.0005
    target_entropy: 0.8
    tau: 0.005
    beta: 0.5
    gamma: 0.99
    lstm_hidden_dim: 256
    lstm_num_layers: 1
    lstm_seq_len: 5

EVAL:
  OPEN: False
  TYPE: "OfflineRL_v1_3"  # OfflineRL_v1_3 | OfflineRL_v1_5
  HYBRID_CKPT: "compare/ckpt/hybirdnetwork_RGBD_two_frame/model_epoch_100.pth"
  SAC_CKPT: "final/telephone/ckpt/8/sac_2level_model_300.pth"
  EPISODES: 0
  MAX_STEPS: 200
  SEED: 0
  STOCHASTIC_SAC: False
  # Optional for v1_5 separate-weight eval
  TEMPORAL_CKPT: ""
  ACTOR_CKPT: ""
  CRITIC1_CKPT: ""
  CRITIC2_CKPT: ""

DATASET:
  TYPE: "AudioNav"
  SPLIT: "train_multiple"
  CONTENT_SCENES: ["*"]
  VERSION: "v1"
  SCENES_DIR: "data/scene_datasets/mp3d"
  DATA_PATH: "data/datasets/audionav/mp3d/{version}/{split}/{split}.json.gz"
